name: build-binaries

# 打 tag（v*）时构建全平台单文件二进制并作为 Release 资产上传；
# 也可在 Actions 页手动触发（workflow_dispatch）只产出构建产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 允许 action-gh-release 创建 Release / 上传资产
      id-token: write          # attest-build-provenance 需要 OIDC 令牌
      attestations: write      # 写入构建来源证明（build provenance）
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Build embeddable data (zh-CN)
        run: node scripts/build-data.js

      - name: Cross-compile all targets
        run: |
          set -e
          mkdir -p dist
          build() { bun build ./postman-traditional-chinese-injector.js --compile --minify --target="bun-$1" --outfile "dist/$2"; }
          build windows-x64  postman-traditional-chinese-injector-win-x64.exe
          build linux-x64     postman-traditional-chinese-injector-linux-x64
          build linux-arm64   postman-traditional-chinese-injector-linux-arm64
          build darwin-x64    postman-traditional-chinese-injector-macos-x64
          build darwin-arm64  postman-traditional-chinese-injector-macos-arm64
          ls -la dist

      # 老 Windows（Win8.1 / Server 2012 R2+）專用：bun 產物靜態連結 ConPTY，在 Win10 1809 以下
      # 無法載入（Issue #4）。改用 pkg（Node 執行環境，動態探測 ConPTY）跨平台打 node16-win-x64。
      - name: Build legacy Windows binary (pkg / Node runtime)
        run: |
          set -e
          node scripts/build-bin-legacy.js
          ls -la dist

      - name: Compress binaries (复用 scripts/compress-dist.js，并行 zip / tar.xz)
        run: |
          set -e
          # tar.xz 里保留可执行位（bun 产物一般已是 0755，这里兜底）
          chmod +x dist/postman-traditional-chinese-injector-linux-x64 \
                   dist/postman-traditional-chinese-injector-linux-arm64 \
                   dist/postman-traditional-chinese-injector-macos-x64 \
                   dist/postman-traditional-chinese-injector-macos-arm64
          # 与本地同一脚本：各文件并行压缩（Windows→zip，其余→tar.xz）
          node scripts/compress-dist.js
          # 脚本默认保留原始二进制（便于本地测试）；CI 只发布压缩包，删掉生二进制
          rm -f dist/postman-traditional-chinese-injector-win-x64.exe \
                dist/postman-traditional-chinese-injector-win-x64-legacy.exe \
                dist/postman-traditional-chinese-injector-linux-x64 \
                dist/postman-traditional-chinese-injector-linux-arm64 \
                dist/postman-traditional-chinese-injector-macos-x64 \
                dist/postman-traditional-chinese-injector-macos-arm64
          ls -la dist

      - name: Build browser extension (zip)
        run: node scripts/build-extension.js

      # 供用户核对下载到的文件与 CI 产物一致（缓解杀软误报时的信任问题，见 README「杀毒软件报毒」）
      - name: Generate SHA256SUMS.txt
        run: |
          set -e
          cd dist
          sha256sum postman-traditional-chinese-injector-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 证明这些发行包确实由本仓库的公开工作流从公开源码构建：
      #   gh attestation verify <文件> --repo <owner>/<repo>
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        # 证明失败不应毁掉整次发版：该步骤在上传之前，报错会中断 job 导致产物发不出去
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/postman-traditional-chinese-injector-*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postman-traditional-chinese-injector-binaries
          path: dist/*

      # 本次更新简介：取 tag 注解正文（git tag -a vX.Y.Z -m "..."）拼在固定说明前面，
      # 让每个 Release 的描述都写清这一版改了什么；没有注解时只留固定说明。
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          # checkout 只取了单个 ref，补一次以确保能读到注解对象
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          notes="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          : > release-notes.md
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            {
              printf '## 本次更新\n\n'
              printf '%s\n' "$notes"
              printf '\n---\n\n'
            } >> release-notes.md
          fi
          cat >> release-notes.md <<'RELEASE_BODY'
          把繁體中文翻譯注入 Postman 的非官方第三方工具。

          - **桌面端**：下載對應平台的壓縮包（Windows 為 `.zip`，Linux/macOS 為 `.tar.xz`），
            解壓得到單檔案後，完全結束 Postman 再執行即可注入；`--restore` 還原。
            （macOS/Linux 解壓後如丟失執行權限：`chmod +x <檔案名>`）
          - **老 Windows**（Win8.1 / Server 2012 R2+，預設版報 `ClosePseudoConsole` 錯誤時）：
            下載 `postman-traditional-chinese-injector-win-x64-legacy.zip`（Node 執行環境打包）。
          - **網頁版**：下載 `postman-traditional-chinese-injector-extension.zip`，解壓後在 Chrome/Edge 用
            「載入已解壓的擴充功能」載入。

          詳見 README。

          **完整性校驗**：`SHA256SUMS.txt` 為本次構建的校驗和；所有發行包均由 GitHub Actions
          從公開原始碼構建並附帶來源證明，可用
          `gh attestation verify <檔案> --repo ${{ github.repository }}` 驗證。

          > 🛡️ **防毒軟體報毒？** 單檔案二進位（bun / pkg 打包）被啟發式誤判是行業通病，非真實威脅。
          > 原因、核實辦法與「直接跑原始碼」的替代方案見 README 的
          > [防毒軟體報毒（誤報）說明](https://github.com/${{ github.repository }}#殺毒軟件報毒誤報說明)。

          ---
          ⚠️ **法律聲明**：本專案為社群維護的非官方工具，**與 Postman, Inc. 無任何關聯**，
          未獲其授權、贊助或背書；"Postman" 是 Postman, Inc. 的商標。本倉庫與發行包**不含、
          也不分發** Postman 的任何原始碼 / 二進位 / 原始語言包——僅有本專案自己的腳本與社群編寫的
          中文譯文。本工具在你**自己的機器**上修改你**自己安裝**的 Postman，是否使用由你自行決定
          並承擔風險，請遵守 Postman 的服務條款與 EULA。程式碼以 MIT 許可發布（不覆蓋派生自 Postman
          文案的譯文數據）。本說明不構成法律意見。
          RELEASE_BODY
          cat release-notes.md

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: postman-traditional-chinese-injector ${{ github.ref_name }}
          # 仅上传二进制与扩展 zip（+ 校验和），不上传 dist/extension 解包目录
          files: |
            dist/postman-traditional-chinese-injector-*
            dist/SHA256SUMS.txt
          body_path: release-notes.md
